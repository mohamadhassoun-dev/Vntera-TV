name: Publish site

# The host's own git deploy runs this same repo build, but it publishes the
# build output into its Node runtime folder and then mirrors an empty document
# root over public_html, which empties the live site. This workflow is the
# authoritative publisher: it builds the same commit and rsyncs dist/ into the
# document root after that build has finished.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install` rather than `npm ci`: the lockfile is produced on Windows,
      # where some platform-specific entries differ, and a mismatch must not be
      # able to stop the only publisher of the live site.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      # The Windows installer is 120 MB and `*.exe` is git-ignored, so it cannot
      # ride in the repository. The release asset is private (the repository is
      # private, and an anonymous release URL answers 404), which is why the site
      # serves the file itself: fetch the asset here with the workflow token and
      # put it in the published folder. Publishing without it would leave the
      # Windows button pointing at a page that is not there, so this step fails
      # loudly instead of skipping.
      - name: Stage the Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          installer="Vntera-Setup-$version.exe"
          mkdir -p dist/files
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern "$installer" --dir dist/files
          size=$(stat -c%s "dist/files/$installer")
          magic=$(head -c2 "dist/files/$installer")
          echo "staged $installer ($size bytes, magic $magic)"
          test "$magic" = "MZ"
          test "$size" -gt 50000000

      - name: Wait for the host deploy to finish
        run: sleep 75

      - name: Install ssh key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publish to document root
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new"
          export RSYNC_RSH
          # The host's own git deploy can still be swapping the document root when
          # this runs, which empties public_html underneath rsync (exit 23, and a
          # live site that answers 403). Publishing again once the host settles is
          # what restores it, so retry instead of failing the only publisher.
          for attempt in 1 2 3 4; do
            if rsync -az --delete --itemize-changes dist/ "$SSH_USER@$SSH_HOST:domains/movies.vntera.com/public_html/"; then
              exit 0
            fi
            echo "rsync attempt $attempt failed; waiting for the host to settle" >&2
            sleep 60
          done
          echo "publish kept failing" >&2
          exit 1

      - name: Verify the live site
        run: |
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://movies.vntera.com/index.html || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              # The Windows button has to serve the real executable, not the app
              # shell: a one-byte Range request proves the file is on the host.
              head -c1 /dev/zero | curl -s -r 0-0 -o /tmp/exe-byte.bin -w 'installer %{http_code} %{size_download}\n' \
                "http://movies.vntera.com/files/Vntera-Setup-$version.exe"
              test "$(cat /tmp/exe-byte.bin)" = "M"
              exit 0
            fi
            sleep 15
          done
          echo "live site did not answer 200" >&2
          exit 1
